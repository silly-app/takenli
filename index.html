<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>תקן לי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f4f0;--card:#fff;--ink:#1f2328;--mute:#80868d;--acc:#2f9e6e;--line:#e2ddd5;--chip:#ece8e1}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#1a2026;--ink:#eceae6;--mute:#8b9197;--acc:#2fbf72;--line:#353c43;--chip:#262a2e}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;display:flex;flex-direction:column;gap:2px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:calc(4px + env(safe-area-inset-bottom));height:100dvh}
  .tools{display:flex;align-items:center;gap:6px;height:52px;flex:none;padding-top:4px}
  .copybtn{height:40px;padding:0 26px;border-radius:999px;background:var(--acc);color:#fff;font-size:17px;font-weight:700}
  .spacer{flex:1}
  .row{flex:0 1 auto;min-height:0;display:flex;align-items:flex-start;gap:8px;overflow:hidden}
  .panel{position:relative;flex:1;min-width:0;align-self:stretch;display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0 6px;transition:border-color .2s}
  .panel:focus-within{border-color:var(--acc)}
  textarea{flex:1;min-width:0;height:auto;min-height:0;border:0;padding:7px 4px;font:inherit;font-size:17px;line-height:1.35;background:transparent;color:var(--ink);resize:none;transition:opacity .2s}
  textarea:focus{outline:none}
  textarea::placeholder{color:var(--mute)}
  textarea.busy{opacity:.45}
  .panel.lp{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent)}
  button{border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:transparent;transition:transform .08s,opacity .2s;flex:none}
  button:active{transform:scale(.9)}
  button:disabled{opacity:.35}
  button svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #fix{width:40px;height:40px;padding:0;border-radius:50%;background:var(--acc);color:#fff;flex:none}
  #fix svg{width:26px;height:26px}
  #fix.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon{width:42px;height:40px;border-radius:12px}
  #clear{width:64px;height:48px;border-radius:14px;margin-inline-start:6px}
  #clear svg{width:26px;height:26px}
  .icon svg{width:21px;height:21px}
  #orig.on{color:var(--acc)}
  #orig:disabled{opacity:.25}
  #toast{pointer-events:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:6px 12px;border-radius:16px;text-align:center;opacity:0;transition:opacity .2s;white-space:pre-line;max-width:94%;line-height:1.5;direction:rtl;z-index:5}
  #toast.on{opacity:.92;pointer-events:auto}
  /* key sheet */
  #keyScrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:10}
  #keyScrim.on{display:flex}
  .sheet{width:100%;max-width:460px;background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:4vh}
  .sheet h2{margin:0;font-size:20px}
  .sheet p{margin:0;color:var(--mute);font-size:15px;line-height:1.5}
  .sheet a{color:var(--acc);font-weight:700}
  .sheet input{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;direction:ltr}
  .sheet .row{display:flex;gap:8px}
  .sheet .row button{flex:1;height:42px;border-radius:999px;background:var(--chip);font-size:15px;font-weight:500}
  .sheet .pri{background:var(--acc)!important;color:#fff;font-weight:700}
</style>
</head>
<body>
  <div class="row">
    <div class="panel" id="panel">
      <textarea id="in" rows="1" placeholder="כתוב איך שיוצא…"></textarea>
      <div id="toast"></div>
    </div>
  </div>
  <div class="tools">
    <button id="fix" aria-label="תקן"><svg viewBox="0 0 24 24"><path d="M4 20L15 9"/><path d="M13 7l4 4"/><path d="M18 2.5v3M16.5 4h3"/><path d="M20.5 9v2.5M19.25 10.25h2.5"/><path d="M9 3v2M8 4h2"/></svg></button>
    <button id="copy" class="copybtn" aria-label="העתק">העתק</button>
    <button id="clear" class="icon" aria-label="מחק"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <span class="spacer"></span>
    <button id="paste" class="icon" aria-label="הדבק"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 4v2h6V4"/><path d="M9 12h6M9 16h6"/></svg></button>
    <button id="orig" class="icon" aria-label="מה כתבתי" disabled><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button id="keyBtn" class="icon" aria-label="מפתח"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="16.5" r="4"/><path d="M10.5 13.5L20 4M16.5 7.5l3 3M14.5 9.5l2 2"/></svg></button>
  </div>

<div id="keyScrim">
    <div class="sheet" role="dialog" aria-modal="true">
      <h2>מפתח API</h2>
      <p>כדי לתקן, האפליקציה צריכה מפתח מחשבון Anthropic שלך. יוצרים אותו ב־<a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> ומדביקים כאן. המפתח נשמר רק בטלפון הזה.</p>
      <input id="keyIn" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <div class="row">
        <button class="pri" id="keySave">שמור</button>
        <button id="keyDel">מחק מפתח</button>
        <button id="keyClose">סגור</button>
      </div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const inp=$('in'), toastEl=$('toast');
let sample=null, busy=false, ctrl=null, undoStack=[], lastOrig='', lastFixed='', showingOrig=false;
const MODEL_LONG='claude-opus-5-5', MODEL_SHORT='claude-sonnet-5-5', SHORT_MAX=300;

function save(){try{localStorage.setItem('draft',inp.value)}catch(e){}}
try{const d=localStorage.getItem('draft'); if(d) inp.value=d;}catch(e){}
inp.addEventListener('input',save);

let tt; function hideToast(){clearTimeout(tt);toastEl.classList.remove('on');}
let sx=null; toastEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true}); toastEl.addEventListener('touchend',e=>{if(sx!=null&&Math.abs(e.changedTouches[0].clientX-sx)>25){e.preventDefault();hideToast()} sx=null});
function toast(m,ms=1800){toastEl.textContent=m;toastEl.onclick=hideToast;toastEl.style.transform='translateX(-50%)';toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),ms)}
function pushUndo(){undoStack.push(inp.value); if(undoStack.length>20) undoStack.shift()}
function autoH(){const tools=document.querySelector('.tools'); const max=Math.max(38,window.innerHeight-tools.offsetHeight-30); inp.style.height='auto'; const small=window.innerHeight<340; inp.style.height=(small?max:Math.min(max,Math.max(38,inp.scrollHeight)))+'px'}
function setText(t){inp.value=t; save(); autoH()}
inp.addEventListener('input',autoH); window.addEventListener('resize',autoH); setTimeout(autoH,0);

/* ---- API key ---- */
function getKey(){try{return localStorage.getItem('apiKey')||''}catch(e){return ''}}
function openKey(){ $('keyIn').value=getKey(); $('keyScrim').classList.add('on'); setTimeout(()=>$('keyIn').focus(),50) }
function closeKey(){ $('keyScrim').classList.remove('on') }
let keyT=0; $('keyBtn').onclick=()=>{const n=Date.now(); if(n-keyT<800){keyT=0; openKey()} else {keyT=n; toast('לחץ פעמיים כדי לפתוח')}};
$('keyClose').onclick=closeKey;
$('keyScrim').addEventListener('click',e=>{if(e.target.id==='keyScrim')closeKey()});
$('keySave').onclick=()=>{const k=$('keyIn').value.trim(); if(!k){toast('הדבק מפתח');return} try{localStorage.setItem('apiKey',k)}catch(e){} closeKey(); toast('המפתח נשמר ✓')};
$('keyDel').onclick=()=>{try{localStorage.removeItem('apiKey')}catch(e){} $('keyIn').value=''; toast('המפתח נמחק')};

let T={};
async function apiSample(prompt,{signal,onText,model}={}){
  const t0=Date.now(); T={retry:false,think:0};
  const key=getKey();
  if(!key){const e=new Error('no key');e.code='no_key';throw e}
  const call=extra=>fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',signal,
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(Object.assign({model:model||MODEL_LONG,max_tokens:16000,stream:true,messages:[{role:'user',content:prompt}]},extra))
  });
  const sonnet=/sonnet/.test(model||'');
  const variants=sonnet?[{thinking:{type:'between_tools'},output_config:{effort:'low'}},{output_config:{effort:'low'}},{}]:[{output_config:{effort:'low'}},{}];
  let r; for(let i=0;i<variants.length;i++){ r=await call(variants[i]); T.variant=i; if(r.status!==400) break; }
  T.conn=Date.now()-t0;
  if(!r.ok){
    let msg=''; try{msg=(await r.json()).error.message||''}catch(_){}
    const e=new Error(msg);
    e.code=r.status===401?'bad_key':r.status===429?'rate_limited':/credit/i.test(msg)?'no_credit':'api_'+r.status;
    throw e;
  }
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', text='', stop='';
  for(;;){
    const {done,value}=await rd.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      const d=line.slice(5).trim(); if(!d||d==='[DONE]')continue;
      let ev; try{ev=JSON.parse(d)}catch(_){continue}
      if(T.first==null) T.first=Date.now()-t0;
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='thinking_delta') T.think++;
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'&&T.text1==null) T.text1=Date.now()-t0;
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text; if(onText)onText({text})}
      else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason){stop=ev.delta.stop_reason}
      else if(ev.type==='error'){const e=new Error((ev.error&&ev.error.message)||''); e.code=/overload|rate/i.test(e.message)?'rate_limited':'api_stream'; throw e}
    }
  }
  T.end=Date.now()-t0; T.chars=text.length;
  return {text,truncated:stop==='max_tokens'};
}

// Inside Claude use its built-in connection; everywhere else use the API key.
if(window.claude&&window.claude.use){claude.use('sample').then(s=>{sample=s||apiSample}).catch(()=>{sample=apiSample})}
else sample=apiSample;

const EXAMPLES=[
 ["יש לי מלא שגיטטת גשאני כוצב בטלפטון אני חושב שזה בחמיר","יש לי מלא שגיאות כשאני כותב בטלפון אני חושב שזה מחמיר"],
 ["איךמאתה יגולבלעסונשרנינאגצןב ככה ואתה תתקן אותי","איך אתה יכול לעזור לי שאני אכתוב ככה ואתה תתקן אותי"],
 ["זה חוקי אבל איך אני משתמש בזה כשרני מתכתב במה כל פעם אני אלךבלהעציק? וגם אני לא אאה את הדיחה","זה חוקי אבל איך אני משתמש בזה כשאני מתכתב? מה, כל פעם אני אלך להעתיק? וגם אני לא אראה את השיחה"],
 ["שים את הכיפורים למעלה ותן לי אפשרות במדיכה להקטין מלמטה אתה חלון","שים את הכפתורים למעלה ותן לי אפשרות במשיכה להקטין מלמטה את החלון"],
 ["גם תשים לב לאם אני לא שם רווחים ואם אפשר להבין על מה אנימבר יעזור","גם תשים לב אם אני לא שם רווחים, ואם אפשר להבין על מה אני מדבר זה יעזור"],
 ["שגודל דיפןלט של החלוניתבייה 2 שורות","שגודל דיפולט של החלונית יהיה 2 שורות"],
 ["הוא אלא מתקן טוב בוא לא מסיןבאותי משנה מילים","הוא לא מתקן טוב, הוא לא מבין אותי, משנה מילים"],
 ["זה לא כמופה כשאת המבין","זה לא כמו פה כשאתה מבין"]
];
const PROMPT=(t,ctx)=>`אתה מפענח הודעות וואטסאפ בעברית שהוקלדו בטלפון על ידי אדם שמתקשה להקליד בגלל עייפות וחולשה בידיים. המטרה: לשחזר בדיוק את מה שהוא התכוון להקליד, מילה במילה, ולא לנסח מחדש.

השגיאות שלו:
- אותיות שכנות במקלדת העברית מוחלפות (למשל ג/כ/ע, ט/א, ר/ק, ש/ד, צ/מ, ב/נ/ה, ן/ם, ף/ץ, ח/ל, י/ו)
- אותיות חסרות, עודפות או בסדר הפוך
- הרבה פעמים אין רווחים, או שבמקום רווח נכנסה אות (בעיקר ב, נ, מ). פרק רצפים ארוכים למילים
- מילה שבורה לשניים

כללים:
- שנה רק מילים שאינן מילים אמיתיות, או שבבירור לא מתאימות להקשר. מילה תקינה שמתאימה להקשר נשארת כמו שהיא, גם אם היא סלנג או לא דקדוקית.
- לכל מילה שבורה בחר את המילה הקרובה ביותר באותיות שמתאימה למשפט. אל תחליף מילה במילה נרדפת "יפה יותר".
- אל תוסיף ואל תסיר תוכן. שמור על הסדר, הסלנג, ירידות השורה והאימוג׳ים. פסיקים רק כשממש צריך.

דוגמאות אמיתיות שלו:
${EXAMPLES.map(([a,b])=>'כתב: '+a+'\nהתכוון: '+b).join('\n\n')}

${ctx.length?`ההודעות האחרונות שלו, רק כדי להבין על מה הוא מדבר עכשיו (לא לתקן):
${ctx.map(c=>'- '+c).join('\n')}

`:''}קודם, בשורה אחת קצרה בלבד, רשום רק מילים קשות בפורמט שגוי=נכון (עד 8 מילים, בלי הסברים), ואז כתוב את ההודעה המשוחזרת כולה בין <fixed> ל-</fixed>.

ההודעה:
${t}`;

async function fix(){
  const text=inp.value.trim();
  if(!text||busy||!sample) return;
  if(sample===apiSample&&!getKey()){openKey();return}
  busy=true; $('fix').disabled=true; inp.classList.add('busy'); inp.readOnly=true;
  $('fix').classList.add('spin');
  ctrl=new AbortController(); const t_start=Date.now();
  const origText=inp.value; let committed=false;
  const stream=t=>{ if(!t||t==='Thinking...')return; const m=t.match(/<fixed>([\s\S]*)/); if(!m)return; const part=m[1].replace(/<\/fixed>[\s\S]*$/,'').trimStart(); if(part){inp.value=part; autoH()} };
  try{
    let ctx=[]; try{ctx=JSON.parse(localStorage.getItem('ctx')||'[]')}catch(e){}
    const r=await sample(PROMPT(text,ctx),{signal:ctrl.signal,cache:false,modelTier:'complex',model:(text.length<=SHORT_MAX?MODEL_SHORT:MODEL_LONG),onText:({text:t})=>stream(t)});
    const t0=r.text||''; const mm=t0.match(/<fixed>([\s\S]*?)(<\/fixed>|$)/);
    if(!mm||(r.truncated&&!/<\/fixed>/.test(t0))){toast(r.truncated?'ההודעה ארוכה מדי, נסה לחלק':'משהו השתבש, נסה שוב');return}
    const res=mm[1].trim();
    if(res){try{const c=JSON.parse(localStorage.getItem('ctx')||'[]');c.push(res);localStorage.setItem('ctx',JSON.stringify(c.slice(-6)))}catch(e){}}
    if(res && res!==origText){inp.value=origText; pushUndo(); lastOrig=origText; lastFixed=res; committed=true; showingOrig=false; setText(res); toast('תוקן ✓',1500); $('orig').disabled=false; $('orig').classList.remove('on')} else toast('נראה תקין');
  }catch(e){
    const c=e&&e.code;
    if(e&&e.name==='AbortError'){}
    else if(c==='no_key'){openKey()}
    else if(c==='bad_key'){toast('המפתח לא תקין');openKey()}
    else if(c==='no_credit') toast('נגמר הקרדיט בחשבון Anthropic');
    else if(c==='rate_limited') toast('רגע, נסה שוב בעוד דקה');
    else if(c==='not_granted') toast('צריך לאשר שימוש');
    else if(!navigator.onLine) toast('אין אינטרנט');
    else toast('משהו השתבש, נסה שוב');
  }finally{
    if(!committed){inp.value=origText; autoH()} $('fix').classList.remove('spin'); busy=false; $('fix').disabled=false; inp.classList.remove('busy'); inp.readOnly=false;
  }
}

async function copy(){
  if(!inp.value.trim()) return;
  try{await navigator.clipboard.writeText(inp.value); toast('הועתק ✓')}
  catch(e){ try{inp.select(); if(document.execCommand('copy')){inp.setSelectionRange(inp.value.length,inp.value.length); toast('הועתק ✓'); return}}catch(_){} inp.focus(); inp.select(); toast('סמן והעתק')}
}

async function readClip(){
  try{ window.focus(); inp.focus() }catch(_){}
  try{
    const items=await navigator.clipboard.read();
    for(const it of items){ if(it.types.includes('text/plain')){ const t=await (await it.getType('text/plain')).text(); if(t) return t } }
  }catch(_){}
  return await navigator.clipboard.readText();
}
async function pasteIn(){
  let t='';
  try{t=await readClip()}catch(e){inp.focus(); toast('לחץ ארוך בתיבה ובחר הדבק'); return}
  if(!t){toast('אין מה להדביק'); return}
  inp.focus(); const st=inp.selectionStart??inp.value.length, en=inp.selectionEnd??inp.value.length;
  setText(inp.value.slice(0,st)+t+inp.value.slice(en)); const pos=st+t.length; try{inp.setSelectionRange(pos,pos)}catch(_){}
  toast('הודבק ✓');
}
$('paste').onclick=pasteIn;
$('fix').onclick=fix;
$('orig').onclick=()=>{ showingOrig=!showingOrig; setText(showingOrig?lastOrig:lastFixed); $('orig').classList.toggle('on',showingOrig); };
inp.addEventListener('input',()=>{ if(lastFixed && inp.value!==lastOrig && inp.value!==lastFixed){ $('orig').disabled=true; $('orig').classList.remove('on'); lastFixed=''; } });
// long press = copy
let lpT=null, lpReady=false, lpX=0, lpY=0;
inp.addEventListener('pointerdown',e=>{ lpReady=false; lpX=e.clientX; lpY=e.clientY; clearTimeout(lpT);
  lpT=setTimeout(()=>{ lpReady=true; $('panel').classList.add('lp'); try{navigator.vibrate&&navigator.vibrate(20)}catch(_){} },550); });
inp.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-lpX)+Math.abs(e.clientY-lpY)>12) clearTimeout(lpT); });
inp.addEventListener('pointercancel',()=>{ if(!lpReady) clearTimeout(lpT); });
inp.addEventListener('touchend',e=>{ clearTimeout(lpT); if(lpReady){ e.preventDefault(); lpReady=false; $('panel').classList.remove('lp'); copy(); } });
inp.addEventListener('pointerup',e=>{ clearTimeout(lpT); if(lpReady){ e.preventDefault(); lpReady=false; $('panel').classList.remove('lp'); copy(); } });
inp.addEventListener('contextmenu',e=>e.preventDefault());
$('copy').onclick=copy;
let cleared=null;
$('clear').onclick=()=>{ if(ctrl) ctrl.abort(); if(!inp.value) return; cleared=inp.value; pushUndo(); setText(''); inp.focus();
  toast('נמחק · לחץ כאן לשחזור',6000);   toastEl.onclick=()=>{ if(cleared!=null){setText(cleared); cleared=null; toast('שוחזר ✓')} }; };

// size: the text box fills whatever height the window (e.g. Samsung split screen) gives it

// installable app: offline shell
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
